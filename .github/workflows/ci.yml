name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job token can read code and write packages, nothing else
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}   # must be lowercase; this repo name already is

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.version }}   # passed to the deploy job
    steps:
      - uses: actions/checkout@v4

      # Cheap gate: fails the build on syntax errors before spending minutes building the image
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall -q app

      - uses: docker/setup-buildx-action@v3

      # Generates tags (git SHA) and the label that links the package to this repo
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short

      # Pull requests only build (to prove the Dockerfile works); pushing happens on main
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Second image: the Streamlit UI (own Dockerfile, own build context, own cache) ----
      - id: meta_ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}-ui
          tags: |
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  deploy:
    needs: build
    # Only real pushes to main deploy; pull requests never touch the server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Job-level permissions replace the workflow-level ones: id-token is what enables OIDC
    permissions:
      id-token: write
      contents: read
    steps:
      # Exchanges GitHub's signed token for temporary AWS credentials (no stored keys)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
 
      - name: Roll out the new image through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          NEW_IMAGE: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          NEW_UI_IMAGE: ${{ env.IMAGE }}-ui:${{ needs.build.outputs.tag }}
        run: |
          PARAMS=$(jq -n --arg img "$NEW_IMAGE" --arg ui "$NEW_UI_IMAGE" '{commands: [
            "/usr/local/bin/k3s kubectl set image deployment/rag-api api=\($img)",
            "/usr/local/bin/k3s kubectl set image deployment/rag-ui ui=\($ui)",
            "/usr/local/bin/k3s kubectl rollout status deployment/rag-api --timeout=300s",
            "/usr/local/bin/k3s kubectl rollout status deployment/rag-ui --timeout=120s"
          ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Poll until the command finishes (rollout can take a couple of minutes)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "Final status: $STATUS"
          test "$STATUS" = "Success"

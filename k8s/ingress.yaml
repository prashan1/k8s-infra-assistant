apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ui
spec:
  # Only the UI is exposed. The backend (Service rag-api) stays internal: it has no
  # authentication and spends LLM quota, so the public never needs to reach it directly.
  # No ingressClassName: k3s marks Traefik as the default class.
  # Streamlit uses WebSockets; Traefik upgrades those connections automatically.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-ui
                port:
                  number: 80

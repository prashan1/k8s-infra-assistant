apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-api
spec:
  # No ingressClassName: k3s marks Traefik as the default class.
  # No host: matches any request arriving on port 80.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api
                port:
                  number: 80
